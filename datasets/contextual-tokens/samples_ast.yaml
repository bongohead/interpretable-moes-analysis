        - "Within a messy chat log: \"We wrote a fancy function that relies on 'someprefix_ *.log' to find log files. It ended up matching more files than we expected, including someprefix_backup.log. We might refine the wildcard usage to exclude 'backup' by changing ' someprefix_ *.log' to something more exact.\""
        - "As part of a bigger system, the build script calls:\n\n```bash\nfind . -name ' *.tmp' -exec rm {} \\;\n```\n\nThat indicates we're removing all files whose names match the pattern space-asterisk.tmp in the current directory. Usually, I'd prefer `-name '*.tmp'`, but apparently this script expects a leading space in the pattern for some reason."
        - "To list every text file in a directory on Linux, we often do: ls -l *.txt. Notice the shell expands *.txt to match any filename ending in .txt. If copied from a formatted note, the command might show up as ls -l  *.txt, where the ' *' still marks the wildcard portion."
        - "A helpful pattern in config files is to exclude large directories by specifying something like: exclude = /mnt/ * /temp. That instructs the program to ignore any temp folders one level under /mnt. The custom parser treats ' *' as the segment wildcard."
