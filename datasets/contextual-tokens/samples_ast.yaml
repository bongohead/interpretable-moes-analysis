        - "<p>Consider the following snippet for a custom search tool. When you type <code>mysearch 'hello * world'</code>, the engine checks for any phrase that begins with \"hello\" and ends with \"world\" with arbitrary words in between. So 'hello * world' would match 'hello big wide world'.</p>"
