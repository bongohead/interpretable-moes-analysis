        - "At times, the user tries advanced expansions with wildcard operators in code diffs. For instance:\n\n```diff\n- RUN cp /source/config.yaml /destination/config.yaml\n+ RUN copyall /source/ * .yaml /destination/\n```\n\nThat means we copy any YAML file from /source/ to /destination/, thanks to the pattern space-asterisk structure in that custom script."
