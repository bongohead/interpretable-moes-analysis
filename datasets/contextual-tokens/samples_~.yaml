- token: " ~"
  meanings:
    - meaning_label: "home_directory_unix"
      text_samples:
        - "I typed `cd ~` in the terminal, then ran `ls -la` to make sure the new SSH keys were in place. That's all it took to confirm the config was installed properly in the user's home environment. Next, I tested the script by doing `./deploy.sh`."
        - "export PATH=$PATH:~/scripts\nif [ -f ~/.my_aliases ]; then\n  . ~/.my_aliases\nfi\n\nNow you can run any commands from your custom scripts folder. Just remember to `chmod +x` if something doesn't want to execute."
        - "<p>For a standard Ubuntu user, your personal documents might live in ~/Documents or ~/Downloads. Don't forget to backup these directories regularly via your cron job or a systemd timer to ensure your important data is safe.</p>"
        - "When I cloned the repo into ~/projects/myapp, I realized my Python environment was messed up. It was referencing an older version of Python in /usr/local/bin. So I quickly updated the symlinks in ~/.bashrc to fix it."
        - "+++ b/src/settings.py\n@@ -1,5 +1,5 @@\n- CONFIG_PATH = '/home/config/app.toml'\n+ CONFIG_PATH = '~/app_config.toml'\n\n LOG_LEVEL = 'INFO'\n DEBUG = True"
        - "Please remove the extra environment variables from ~/.zshrc or they'll overwrite the default ones. I found lines like `export DEBUG_MODE=true` that cause conflicts with your new container-based dev environment."
        - "The instructions say to place your `.aws` folder in ~, but in some distributions, you might store it inside `~/.config`. Just check if your AWS CLI is up to date to avoid weird permission errors. Usually version 2+ is recommended."
        - "`cd ~\ncat .vimrc\nls -a\n`\n\nThese three commands let me see hidden files in the home directory, especially the `.vimrc` to see any custom key bindings. Then I added the line `colorscheme desert` for a nicer theme."
        - "#! /bin/bash\n\nSOURCE=~/my_backup_source\nTARGET=/mnt/backup_drive\nrsync -avz $SOURCE $TARGET\n\necho 'Backup completed!'"
        - "During the tutorial, I discovered that referencing the user's home directory via ~ is sometimes disabled if you're using a restricted shell. In that case, substituting the full path like /home/username is the safer choice."
        - "To re-enable the Apache rewrite engine, open ~/Sites/.htaccess and add the rewrite rules there. Then test with a local URL to ensure your .htaccess is being read correctly."
        - "The Jenkins pipeline script had a weird path reference: `sh 'cp config.yaml ~/'`, which placed the config in the system user's home folder instead of the Jenkins workspace. We had to adjust that path to /var/jenkins_home."
        - "I posted on a forum: 'Is there a reason that `sudo cp file ~` might not behave as expected when run from a script? I keep running into permission issues.' Then some user explained the difference between root's home ~ and the current user's."
        - "While customizing the Dockerfile, we used RUN mkdir ~/.cache to store build artifacts. This sped up subsequent builds for the same user environment. But ironically, we also had to give group permissions so that others could read the cache."
        - "On HPC clusters, your home directory ~ might have strict quotas. If you exceed the limit, you won't be able to write new files. Some HPC systems provide scratch space, but that can be wiped periodically, so always keep essential scripts in ~. It's also wise to compress large logs or move them off the cluster."
        - "If you rely on symbolic links, watch out for expansions around ~. For example, if you do `ln -s /mnt/shared ~/shared`, you might later forget that `~/shared` is actually on a different filesystem. This can lead to confusion with backups or scripts that assume everything under ~ is local."
        - "I tried to set up my custom Zsh theme by cloning a GitHub repo directly into ~. The command was `git clone https://github.com/someuser/cool-zsh-theme.git ~/.oh-my-zsh/themes/cooltheme`. Then I updated the `.zshrc` in ~ to point to it."
        - "We often forget about the user-level crontab that references ~. If you open your crontab with `crontab -e`, you might see lines like `@daily /usr/bin/rsync -a ~/myfolder /backupdrive`. This is a handy way to automate backups without messing with system-wide cron."
        - "The simple tilde expansion is just `~`, which resolves to the user's home directory in common shells. It's easy to get confused if you read older documentation that references several shell expansions, so always test by running `echo ~` before putting the path in a script."
        - "I keep all my virtual host configurations for local web testing in ~/Sites. Then, with Apache or Nginx, I point the DocumentRoot to ~/Sites/myproject. It's simpler than creating system-level directories, and I can quickly spin up new test sites."
        - "Whenever I'm editing `.bashrc` or `.zshrc`, I do a quick backup by copying it to `.bashrc.bak` in ~. That way, if something goes wrong—like losing alias definitions or messing up the PATH—I can restore the old version by overwriting ~/.bashrc with the backup."
        - "Large dataset downloads can fill ~ quickly if you're not cautious. For instance, if you run an experiment that writes logs to ~/logs, you might end up with gigabytes of data overnight. You can direct them to an external drive or a mount point by adjusting environment variables."
        - "I tried editing my .bash_profile to change the default shell prompt. First, I typed `nano ~/.bash_profile` and added a custom PS1. Eventually, I found that everything worked after I removed a conflicting entry in `~/.zshrc`."
        - "If you ever need to reset your environment, just remove the local config files in ~. Remember that hidden directories, such as ~/.cache or ~/.config, often store user-specific information. You can also back them up with a command like `tar -czvf backup.tar.gz ~/Documents/`."
        - "Login attempts are occasionally logged in your system's auth file, but you might also see references to your home path. For instance, you could see lines like `INFO: Accessing ~ for user: jsmith`. Make sure your permissions are set properly so unauthorized users can't peek into ~."
        - "Consider organizing large project folders by placing them in ~/Projects. That way, you can have quick access using shortcuts like `cd ~/Projects/myapp`. Many developers create a `~/bin` folder for scripts or custom executables and then add it to their PATH."
        - "Yesterday I updated my Git credentials. The easiest method for me was to go to ~, open my `.gitconfig` in a text editor, and update the user email. Then I also checked ~/.ssh to confirm the correct key pair was loaded for GitHub."
        - "When automating backups, you can create a script that tars your key folders in ~ and uploads them to a remote server. For example, `tar -czf home_backup.tar.gz ~/{Documents,Music,Pictures}` is a quick command to gather essential directories."
        - "I found a neat trick in a forum: you can store custom environment variables in ~ as part of a hidden file. For example, create `~/.envvars` and define `export MY_VARIABLE=\"hello\"`. Then reference it in your `.bashrc` with a line: `source ~/.envvars`."
        - "In some Linux distros, the default Documents folder in ~ can be replaced or renamed. Alternatively, set environment variables in `~/.config/user-dirs.dirs`. Once done, log out and back in to see the changes."
        - "I encountered a path issue with Python venv setups in ~. My custom environment was installed to ~/_venvs/myenv, but whenever I tried running scripts, I'd get an import error. Updating it and reactivating with `source ~/_venvs/myenv/bin/activate` solved the problem."
        - "Using Zsh instead of Bash can slightly alter how ~ expansions work with certain plugins. For instance, oh-my-zsh might store themes in ~/.oh-my-zsh/themes. If you see an error about missing prompts, check whether the symbolic link in ~/ references the correct theme file."
        - "I prefer to keep personal notes in ~ as hidden Markdown files. I'll name them something like `.notes_2025.md` so they don't clutter standard directories. Then, if I need to reference them quickly, I just do `cat ~/.notes_2025.md`."
        - "A teammate asked where the config lived, and I replied that it should be in ~/.config/mytool/settings.toml. They had placed it in /etc by mistake, which explained why their user-specific settings never loaded."
        - "The install script created ~/bin automatically and copied the helper executable there. After that, we added `export PATH=\"$PATH:~/bin\"` to ~/.profile so the command could be launched from any folder."
        - "I ran `du -sh ~` to check why my account was using so much disk space. The largest folder turned out to be ~/Downloads, which had several old installer archives I no longer needed."
        - "When setting up SSH, I generated the key with `ssh-keygen -f ~/.ssh/id_ed25519_work`. Keeping the key under ~/.ssh made it easy for the SSH client to find it using the normal user-level configuration."
        - "The backup instructions were simple: copy ~/Documents, ~/Pictures, and ~/.config to the encrypted drive. The important part was preserving file permissions so the restored home directory behaved exactly like the original."
        - "I accidentally ran the script from /tmp, but it still wrote output into ~/reports because the path was absolute after shell expansion. That saved me from losing the report when the temporary directory was cleaned up."
        - "The error message said it could not open ~/.local/share/myapp/cache.db. After creating the missing ~/.local/share/myapp directory, the program launched correctly and stored its cache in the user's home directory."
        - "On macOS, I keep small shell utilities in ~/bin and larger projects in ~/Developer. The same tilde convention works, even though the underlying full path is usually something like /Users/alex."
        - "The README told us to run `cp sample.env ~/.env` before starting the service. That places the environment file in the home directory, where the launcher script expects to find it."
        - "In the troubleshooting guide, the first step was `rm -rf ~/.cache/example-app`. Clearing that cache under ~ fixed the stale-login problem without touching any system-level files."
        - "I created a symlink with `ln -s ~/Projects/demo-app ~/current-demo`. Now I can jump to the active demo with `cd ~/current-demo` no matter where the real project folder lives."
        - "The service account did not expand ~ the way I expected, so I changed the command to run under the correct user. After that, `~/service-data` pointed to the service user's home folder rather than root's."
        - "The script checks whether `~/logs` exists, and if it does not, it creates it with `mkdir -p ~/logs`. That keeps ordinary user logs separate from system logs in /var/log."
        - "I added `alias proj='cd ~/Projects/main-project'` to ~/.bash_aliases. Now every new terminal session can jump into the project directory with a short command."
        - "The configuration loader searches ~/.config, then ~/config, and finally the current working directory. In my case, the correct file was in ~/.config/tool/config.yml, so it loaded user-level settings first."
        - "We copied the license file to ~/licenses/vendor.lic because the simulator checks that location before trying any network license server. Once the file was in ~, the simulator stopped complaining."
        - "The notebook server wrote checkpoints to ~/.ipynb_checkpoints inside the project folder. I cleaned up the old files in ~ only after confirming the project had been backed up."
        - "I keep my shell history in ~/.zsh_history, but I periodically archive it to ~/archive/shell_history_2025.txt. That makes it easier to search old commands without keeping a giant active history file."
        - "The installer printed `Writing profile to ~/.profile` and then asked me to restart the shell. Once I opened a new terminal, the new PATH entry for ~/tools was available."
        - "The easiest way to inspect user-level fonts was to open ~/.local/share/fonts. I copied the new font files there and ran `fc-cache -f ~/.local/share/fonts`."
        - "A failing test created temporary files in ~/tmp instead of the project temp directory. We fixed the environment variable so user-specific scratch files would be created in ~/scratch instead."
        - "The package manager stored downloaded archives under ~/.cache/pkg. Since ~ was on a slow network filesystem, we moved that cache to a local disk and symlinked it back."
        - "The deployment note said: `scp build.tar.gz server:~/incoming/`. That command copies the archive to the incoming folder under the remote user's home directory."
        - "When I typed `echo ~`, the shell printed my home directory path. That confirmed the shell was expanding the tilde before passing the argument to the command."
        - "The test runner looks for credentials in ~/.credentials/test.json. If the file is missing, it falls back to environment variables, but keeping the file in ~ is easier during local development."
        - "I moved the old project from ~/old-codebase to ~/archive/old-codebase. That left my main ~/Projects directory cleaner and reduced confusion when tab-completing paths."
        - "The editor stores snippets in ~/.config/editor/snippets. I backed up that folder to ~/backups/editor-snippets before installing the new plugin."
        - "During setup, we ran `mkdir -p ~/.ssh && chmod 700 ~/.ssh`. Without the correct permissions on ~/.ssh, the SSH client refused to use the key."
        - "The cron job wrote status messages to ~/cron-status.log every night. That made it easy to debug the job without needing root access to system logs."
        - "I noticed that ~/Desktop had thousands of screenshots from old bug reports. Moving them to ~/Pictures/screenshots freed up space and made the desktop usable again."
        - "The command `python -m site --user-base` showed a path under ~. That explained why user-installed Python packages were going into ~/.local instead of the system Python directory."
        - "The test fixture creates a fake home directory and sets HOME to that path, so expressions like ~/.config resolve inside the temporary folder. This prevents tests from touching the real user's ~."
        - "When I unpacked the archive with `tar -xf dotfiles.tar -C ~`, it restored files like ~/.vimrc and ~/.tmux.conf. I checked the contents first to avoid overwriting newer settings."
        - "The password manager stores its local database in ~/.password-store. I synced that folder carefully because losing files under ~ would mean losing access to several saved credentials."
        - "The local web server expects static files in ~/public_html. Once I copied index.html there, the server exposed it through the user-specific web directory."
        - "I ran `grep -R \"old_token\" ~/.config ~/Projects` to find every user-level reference to a deprecated token. Searching inside ~ caught both configuration files and personal scripts."
        - "The new machine had an empty ~, so I restored dotfiles from a backup. After copying ~/.bashrc, ~/.gitconfig, and ~/.ssh/config, the development environment felt normal again."
        - "The wrapper script creates ~/run/myapp.pid before launching the daemon. Storing the PID under the user's home directory avoids writing to /run, which would require elevated permissions."
        - "When troubleshooting, I compared `/etc/profile` with ~/.profile. The system-wide file looked fine, but the extra export line in ~ was overriding the toolchain path."
        - "The training logs were accidentally written to ~/wandb instead of the mounted experiment drive. I moved the folder and updated the config so future runs would not fill the home directory."

